<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>警来帮 · 智慧寻物</title>
<style>
:root{--blue:#1a56db;--bg:#0f1f3d;--green:#0e9f6e;--orange:#d97706;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#0f1f3d,#1a3a6e 55%,#0f1f3d);background-attachment:fixed;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:18px 15px 44px}
header{color:#fff;text-align:center;padding:10px 0 16px}
header .logo{font-size:30px;font-weight:800;letter-spacing:2px}
header .sub{opacity:.85;font-size:14px;margin-top:6px}
.searchbar{display:flex;gap:8px;margin-bottom:14px}
.searchbar input{flex:1;padding:14px 16px;border:none;border-radius:14px;font-size:16px}
.searchbar button{background:var(--blue);color:#fff;border:none;border-radius:14px;padding:0 22px;font-size:16px;font-weight:600}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;text-align:center;background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:12px;font-size:15px;font-weight:600;border:1.5px solid transparent}
.tab.active{background:#fff;color:var(--blue)}
.card{background:#fff;border-radius:16px;padding:8px 18px 18px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.item{border:1.5px solid var(--line);border-radius:13px;padding:14px;margin-top:12px}
.item .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item .nm{font-weight:700;font-size:17px}
.item .cat{font-size:12px;color:var(--muted)}
.item .meta{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.7}
.codebox{margin-top:12px;background:#eef4ff;border-radius:11px;padding:12px 14px;text-align:center}
.codebox .lab{font-size:12px;color:var(--muted)}
.codebox .cd{font-size:28px;font-weight:800;letter-spacing:5px;color:var(--blue);font-family:"Courier New",monospace;margin-top:2px}
.codelookup{display:none}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.notice{color:#fff;opacity:.8;text-align:center;font-size:12px;margin-top:16px}
.qinput{width:100%;padding:14px 16px;border:none;border-radius:14px;font-size:20px;text-align:center;letter-spacing:6px;font-family:"Courier New",monospace}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">警来帮 · 智慧寻物</div>
    <div class="sub">查询招领物品 / 凭码查询进度</div>
  </header>

  <div class="tabs">
    <div class="tab active" id="tabList" onclick="switchTab('list')">浏览招领</div>
    <div class="tab" id="tabCode" onclick="switchTab('code')">凭码查询</div>
  </div>

  <div id="pane-list">
    <form class="searchbar" onsubmit="doSearch(event)">
      <input id="q" placeholder="搜索物品名称 / 类别 / 地点">
      <button type="submit">搜索</button>
    </form>
    <div class="card"><div id="list"><div class="empty">加载中…</div></div></div>
  </div>

  <div id="pane-code" style="display:none">
    <div class="card">
      <form onsubmit="doCode(event)">
        <div style="padding:14px 4px 10px;color:var(--muted);font-size:14px;text-align:center">输入民警给你的 6 位查询码</div>
        <input id="code" class="qinput" maxlength="6" inputmode="numeric" placeholder="••••••">
        <div style="margin-top:14px"><button type="submit" style="width:100%;background:var(--orange);color:#fff;border:none;border-radius:13px;padding:14px;font-size:16px;font-weight:600">查询</button></div>
      </form>
      <div id="coderesult"></div>
    </div>
  </div>

  <div class="notice">数据由车站警务室实时提供 · 找到物品请凭码到服务台领取</div>
</div>

<script>
const API = ""; // 同域 Pages Functions
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path){
  const r = await fetch(API+path);
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

function renderItem(it, showCode){
  return `<div class="item">
    <div class="top">
      <div><div class="nm">${esc(it.item_name)}</div><div class="cat">${esc(it.category||"")} ${it.color?"· "+esc(it.color):""}</div></div>
      ${it.status==="claimed"?'<span style="color:#0e9f6e;font-weight:700;font-size:13px">已领取</span>':""}
    </div>
    <div class="meta">
      ${it.found_location?"📍 "+esc(it.found_location):""} ${it.found_time?"· "+esc(it.found_time):""}<br>
      ${it.features?esc(it.features):""}
      ${it.locker?"<br>请至："+esc(it.locker):""}
    </div>
    ${showCode?`<div class="codebox"><div class="lab">你的查询/取件码</div><div class="cd">${esc(it.code)}</div></div>`:""}
  </div>`;
}

async function loadList(q){
  const box=document.getElementById("list");
  try{
    const path="/api/items"+(q?"?q="+encodeURIComponent(q):"");
    const {items}=await api(path);
    box.innerHTML = items.length ? items.map(it=>renderItem(it,false)).join("")
      : '<div class="empty">没有找到相关物品<br>换个关键词试试，或到服务台咨询</div>';
  }catch(err){ box.innerHTML='<div class="empty">暂时无法加载数据，请稍后再试或联系服务台</div>'; }
}

function doSearch(e){ e.preventDefault(); loadList(document.getElementById("q").value.trim()); }

async function doCode(e){
  e.preventDefault();
  const code=document.getElementById("code").value.trim();
  const box=document.getElementById("coderesult");
  if(code.length!==6){ box.innerHTML='<div class="empty">请输入 6 位码</div>'; return; }
  box.innerHTML='<div class="empty">查询中…</div>';
  try{
    const {items}=await api("/api/items?code="+encodeURIComponent(code));
    box.innerHTML = items.length ? items.map(it=>renderItem(it,true)).join("")
      : '<div class="empty">没有该码对应的记录，请核对后再试</div>';
  }catch(err){ box.innerHTML='<div class="empty">查询失败，请稍后再试</div>'; }
}

function switchTab(t){
  document.getElementById("tabList").classList.toggle("active",t==="list");
  document.getElementById("tabCode").classList.toggle("active",t==="code");
  document.getElementById("pane-list").style.display=t==="list"?"block":"none";
  document.getElementById("pane-code").style.display=t==="code"?"block":"none";
}

loadList("");
</script>
</body>
</html>
